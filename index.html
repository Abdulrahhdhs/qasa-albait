<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5d4b">

  <title>قاصّة البيت - تحميل التطبيق</title>

  <link rel="icon" href="icon.png">

  <style>
    :root {
      --bg: #08110f;
      --card: #0f1f1b;
      --primary: #0f7a5a;
      --primary2: #19a875;
      --gold: #e1bc55;
      --text: #f7faf9;
      --muted: #aebdb8;
      --line: rgba(255,255,255,.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(25,168,117,.18), transparent 32%),
        radial-gradient(circle at 100% 100%, rgba(225,188,85,.12), transparent 28%),
        var(--bg);
      color: var(--text);

      display: grid;
      place-items: center;

      padding: 24px;
    }

    .shell {
      width: min(520px, 100%);

      background: linear-gradient(
        180deg,
        rgba(255,255,255,.055),
        rgba(255,255,255,.025)
      );

      border: 1px solid var(--line);
      border-radius: 32px;

      padding: 28px;

      box-shadow: 0 30px 80px rgba(0,0,0,.35);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: #d7f7ea;

      background: rgba(25,168,117,.12);

      border: 1px solid rgba(25,168,117,.25);

      padding: 8px 12px;

      border-radius: 999px;

      font-size: 14px;

      margin-bottom: 18px;
    }

    .icon {
      width: 132px;
      height: 132px;

      object-fit: cover;

      border-radius: 30px;

      box-shadow: 0 18px 44px rgba(0,0,0,.38);

      border: 1px solid rgba(255,255,255,.1);

      background: #0b1613;
    }

    h1 {
      margin: 20px 0 8px;

      font-size: 34px;

      line-height: 1.2;
    }

    .sub {
      margin: 0 auto;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.8;

      max-width: 390px;
    }

    .download {
      margin-top: 26px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      width: 100%;

      min-height: 58px;

      border-radius: 18px;

      text-decoration: none;

      color: white;

      font-size: 18px;

      font-weight: 800;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--primary2)
        );

      box-shadow:
        0 14px 30px rgba(15,122,90,.30);

      transition: .2s ease;
    }

    .download:hover {
      transform: translateY(-2px);
    }

    .download:active {
      transform: translateY(0);
    }

    .meta {
      margin-top: 18px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .meta div {
      background: rgba(255,255,255,.035);

      border: 1px solid var(--line);

      border-radius: 16px;

      padding: 13px;
    }

    .meta span {
      display: block;

      color: var(--muted);

      font-size: 12px;

      margin-bottom: 3px;
    }

    .meta b {
      font-size: 14px;
    }

    footer {
      margin-top: 24px;

      color: var(--muted);

      font-size: 14px;
    }

    footer strong {
      color: var(--gold);
    }

    @media (max-width: 420px) {
      .shell {
        padding: 22px 18px;
      }

      .icon {
        width: 112px;
        height: 112px;
      }

      h1 {
        font-size: 29px;
      }

      .meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="shell">

    <div class="badge">
      📱 تطبيق أندرويد
    </div>

    <img
      class="icon"
      src="icon.png"
      alt="أيقونة تطبيق قاصّة البيت"
    >

    <h1>
      قاصّة البيت
    </h1>

    <p class="sub">
      حمّل تطبيق قاصّة البيت مباشرة على جهاز Android.
      اضغط الزر بالأسفل وسيبدأ تحميل التطبيق.
    </p>

    <a
      class="download"
      href="https://github.com/Abdulrahhdhs/qasa-albait/releases/download/V1.0/QasaAlBait.apk"
    >
      ⬇️ تحميل التطبيق APK
    </a>

    <section class="meta">

      <div>
        <span>
          المنصة
        </span>

        <b>
          Android
        </b>
      </div>

      <div>
        <span>
          طريقة التحميل
        </span>

        <b>
          تحميل مباشر
        </b>
      </div>

    </section>

    <footer>
      مطور التطبيق
      <strong>
        AYR
      </strong>
    </footer>

  </main>

</body>
</html>
